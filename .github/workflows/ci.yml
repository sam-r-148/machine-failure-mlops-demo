name: Model API CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Register Jupyter kernel
        run: python -m ipykernel install --user --name python3
      - name: Validate committed Kaggle dataset snapshot
        run: python scripts/validate_data.py
      - name: Train and evaluate in Jupyter
        run: python scripts/execute_notebook.py
      - name: Test saved model and API
        run: python -m pytest -q --junitxml=artifacts/test-results.xml
      - name: Build Docker image
        run: docker build -t maintenance-api:ci .
      - name: Start container
        run: docker run -d --name maintenance-ci -p 127.0.0.1:8000:8000 maintenance-api:ci
      - name: Exercise Docker endpoints
        run: python scripts/smoke_test.py
      - name: Container logs
        if: always()
        run: docker logs maintenance-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f maintenance-ci || true
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-and-test-evidence
          path: |
            artifacts/
            data/provenance.json
            notebooks/01_train_maintenance.ipynb
