name: Model API CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t maintenance-api:ci .
      - name: Start container
        run: docker run -d --name maintenance-ci -p 127.0.0.1:8000:8000 maintenance-api:ci
      - name: Exercise Docker endpoints
        run: |
          python3 - <<'PY'
          """Test real HTTP endpoints against the local or Docker API."""
          import json
          import http.client
          import sys
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8000"
          sample = {"product_type": "M", "air_temperature_k": 298.1,
                    "process_temperature_k": 308.6, "rotational_speed_rpm": 1551,
                    "torque_nm": 42.8, "tool_wear_min": 0}

          def request(path, body=None):
              req = urllib.request.Request(base + path,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=5) as response:
                  return json.load(response)

          def main():
              global base
              base = sys.argv[1] if len(sys.argv) > 1 else base
              for attempt in range(45):
                  try:
                      assert request("/health")["status"] == "ok"
                      break
                  except (urllib.error.URLError, TimeoutError, ConnectionError, http.client.RemoteDisconnected):
                      time.sleep(1)
              else:
                  raise RuntimeError("API not healthy")
              assert request("/")["docs"] == "/docs"
              assert request("/model-info")["model_version"] == "maintenance-rf-v1"
              result = request("/predict", sample)
              assert 0 <= result["failure_probability"] <= 1
              assert result["machine_failure"] == (result["failure_probability"] >= result["decision_threshold"])
              try:
                  request("/predict", {**sample, "torque_nm": -1})
              except urllib.error.HTTPError as error:
                  assert error.code == 422
              else:
                  raise AssertionError("Bad input accepted")
              assert request("/metrics")["predictions"] >= 1
              print(json.dumps({"result": "PASS", "prediction": result}, indent=2))


          if __name__ == "__main__":
              main()
          PY
      - name: Container logs
        if: always()
        run: docker logs maintenance-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f maintenance-ci || true
